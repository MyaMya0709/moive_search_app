<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>영화 검색 앱</title>
    <link rel="stylesheet" href="./buildStyle.css" />
  </head>

  <body>
    <header class="header">
      <h1>영화 검색</h1>
      <p>영화 제목을 검색해 결과를 확인해보세요.</p>
    </header>

    <main class="container">
      <section class="search-section">
        <input
          type="text"
          id="searchInput"
          placeholder="예: Avengers"
          autocomplete="off"
        />
        <button id="searchButton">검색</button>
      </section>

      <section class="recent-section">
        <div class="recent-header">
          <h2>최근 검색어</h2>
          <button id="clearRecentButton" type="button" class="clear-button">
            전체 삭제
          </button>
        </div>
        <div id="recentKeywords" class="recent-keywords"></div>
      </section>

      <section class="status-section">
        <p id="message">영화 제목을 입력하고 검색해보세요.</p>
      </section>

      <section id="movieList" class="movie-list"></section>
    </main>

    <div id="movieModal" class="modal hidden">
      <div class="modal-overlay"></div>

      <div class="modal-content">
        <button id="closeModalButton" class="close-button" type="button">
          ×
        </button>

        <div id="modalBody" class="modal-body">
          <!-- JS로 상세 정보가 들어갑니다 -->
        </div>
      </div>
    </div>

    <div class="bottom-info-bar">
      <span class="bottom-info-bar__text">Data provided by TMDB</span>
      <button id="aboutBtn" class="bottom-info-bar__btn" type="button">
        About
      </button>
    </div>

    <div id="aboutModal" class="about-modal" aria-hidden="true">
      <div
        class="about-modal__panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="aboutTitle"
      >
        <button
          id="aboutCloseBtn"
          class="about-modal__close"
          type="button"
          aria-label="닫기"
        >
          &times;
        </button>

        <h2 id="aboutTitle">About</h2>
        <p>이 앱은 영화 검색과 상세 정보 확인을 위한 웹 애플리케이션입니다.</p>

        <div class="about-modal__section">
          <h3>Data Source</h3>
          <p>Data provided by TMDB.</p>
          <img
            src="https://www.themoviedb.org/assets/2/v4/logos/v2/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg"
            alt="TMDB Logo"
            class="about-modal__logo"
          />
          <p class="about-modal__notice">
            This product uses the TMDB API but is not endorsed or certified by
            TMDB.
          </p>
          <a
            href="https://www.themoviedb.org"
            target="_blank"
            rel="noopener noreferrer"
            class="about-modal__link"
          >
            Visit TMDB
          </a>
        </div>
      </div>
    </div>

    <script src="./buildJS.js"></script>
  </body>
</html>
