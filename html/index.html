<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>영화 검색 앱</title>
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body>
        <header class="header">
            <h1>영화 검색</h1>
            <p>영화 제목을 검색해 결과를 확인해보세요.</p>
        </header>

        <main class="container">
            <section class="search-section">
                <input
                 type="text"
                 id="searchInput"
                 placeholder="예: Avengers"
                 autocomplete="off"
                />
                <button id="searchButton">검색</button>
            </section>

            <section class="status-section">
                <p id="message">영화 제목을 입력하고 검색해보세요.</p>
            </section>

            <section id="movieList" class="movie-list"></section>
        </main>

        <script src="../js/script.js"></script>
    </body>
</html>
